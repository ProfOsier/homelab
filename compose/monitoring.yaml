name: monitoring

x-defaults: &defaults
  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  grafana:
    <<: *defaults

    image: grafana/grafana-oss:12.1.0

    container_name: grafana

    ports:
      - "${GRAFANA_PORT}:3000"

    volumes:
      - ../config/monitoring/grafana:/var/lib/grafana

    environment:
      GF_SERVER_ROOT_URL: https://grafana.osier.local

    networks:
      - monitoring
      - proxy    
  prometheus:
    <<: *defaults

    image: prom/prometheus:v3.6.0

    container_name: prometheus

    ports:
      - "${PROMETHEUS_PORT}:9090"

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

    volumes:
      - ../config/monitoring/prometheus:/etc/prometheus
      - ../config/monitoring/prometheus-data:/prometheus

    networks:
      - monitoring
      - proxy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  graphite-exporter:
    image: prom/graphite-exporter:latest
    container_name: graphite-exporter
    restart: unless-stopped
    command:
      - '--graphite.mapping-config=/etc/graphite-exporter/mapping.yml'
    ports:
      - "9108:9108"
      - "9109:9109/tcp"
      - "9109:9109/udp"
    volumes:
      - /opt/homelab/config/monitoring/graphite-exporter:/etc/graphite-exporter
    networks:
      - monitoring

  cadvisor:
    <<: *defaults

    image: gcr.io/cadvisor/cadvisor:latest

    container_name: cadvisor

    ports:
      - "${CADVISOR_PORT}:8080"

    privileged: true

    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring
      - proxy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  loki:
    <<: *defaults

    image: grafana/loki:3.5.4

    container_name: loki

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - ../config/monitoring/loki:/etc/loki

    networks:
      - monitoring

  promtail:
    <<: *defaults

    image: grafana/promtail:3.5.4

    container_name: promtail

    command:
      - -config.file=/etc/promtail/config.yml

    volumes:
      - /var/log:/var/log
      - ../config/monitoring/promtail:/etc/promtail

    networks:
      - monitoring
      - proxy

networks:

  monitoring:
    external: true

  proxy:
    external: true
