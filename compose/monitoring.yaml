name: monitoring

x-defaults: &defaults
  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  # OpenObserve is already deployed; preserve its existing /data layout and credentials.
  openobserve:
    <<: *defaults
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?Set the existing OpenObserve email in .env}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Set the existing OpenObserve password in .env}
    volumes:
      - ${APPDATA:-/mnt/truenas}/openobserve:/data
    networks:
      - monitoring
      - proxy

  alloy:
    <<: *defaults
    image: grafana/alloy:latest
    container_name: alloy
    command:
      - run
      - --stability.level=experimental
      - /etc/alloy
    environment:
      OPENOBSERVE_LOKI_URL: ${OPENOBSERVE_LOKI_URL:-http://openobserve:5080/api/default/loki/api/v1/push}
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER:?Set the existing ingestion user in .env}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD:?Set the existing ingestion password in .env}
    ports:
      - "1514:1514/udp"
      - "1515:1515/udp"
    volumes:
      - ../config/monitoring/alloy:/etc/alloy:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring

  grafana:
    <<: *defaults

    image: grafana/grafana-oss:12.1.0

    container_name: grafana

    ports:
      - "${GRAFANA_PORT}:3000"

    volumes:
      - ${APPDATA}/grafana:/var/lib/grafana

    environment:
      GF_SERVER_ROOT_URL: https://grafana.osier.local

    networks:
      - monitoring
      - proxy    
  prometheus:
    <<: *defaults

    image: prom/prometheus:v3.6.0

    container_name: prometheus

    ports:
      - "${PROMETHEUS_PORT}:9090"

    command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus/data'

    volumes:
      - ../config/monitoring/prometheus:/etc/prometheus
      - ${APPDATA}/prometheus-data:/prometheus




    networks:
      - monitoring
      - proxy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  graphite-exporter:
    image: prom/graphite-exporter:latest
    container_name: graphite-exporter
    restart: unless-stopped
    command:
      - '--graphite.mapping-config=/etc/graphite-exporter/mapping.yml'
    ports:
      - "9108:9108"
      - "9109:9109/tcp"
      - "9109:9109/udp"
    volumes:
      - /opt/homelab/config/monitoring/graphite-exporter:/etc/graphite-exporter
    networks:
      - monitoring

  cadvisor:
    <<: *defaults

    image: gcr.io/cadvisor/cadvisor:latest

    container_name: cadvisor

    ports:
      - "${CADVISOR_PORT}:8080"

    privileged: true

    devices:
      - /dev/kmsg

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

    networks:
      - monitoring
      - proxy

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  loki:
    <<: *defaults

    image: grafana/loki:3.5.4

    container_name: loki

    command:
      - -config.file=/etc/loki/local-config.yaml

    volumes:
      - ../config/monitoring/loki:/etc/loki:ro
      - /mnt/truenas/loki:/loki

    networks:
      - monitoring

  promtail:
    <<: *defaults

    image: grafana/promtail:3.5.4

    container_name: promtail

    command:
      - -config.file=/etc/promtail/config.yml

    volumes:
      - /var/log:/var/log
      - ../config/monitoring/promtail:/etc/promtail

    networks:
      - monitoring
      - proxy



networks:

  monitoring:
    external: true

  proxy:
    external: true
