name: infrastructure

services:

  homepage:

    image: ghcr.io/gethomepage/homepage:latest

    container_name: homepage

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${HOMEPAGE_PORT}:3000"

    volumes:
      - ../../config/infrastructure/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.osier.local

    networks:
      - infrastructure

  npm:

    image: jc21/nginx-proxy-manager:latest

    container_name: npm

    restart: unless-stopped

    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "${NPM_ADMIN_PORT}:81"

    volumes:
      - ../../config/infrastructure/npm/data:/data
      - ../../config/infrastructure/npm/letsencrypt:/etc/letsencrypt

    networks:
      - infrastructure
      - proxy

  portainer:

    image: portainer/portainer-ce:latest

    container_name: portainer

    restart: unless-stopped

    ports:
      - "${PORTAINER_PORT}:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../config/infrastructure/portainer/data:/data

    networks:
      - infrastructure

  dozzle:

    image: amir20/dozzle:latest

    container_name: dozzle

    restart: unless-stopped

    ports:
      - "${DOZZLE_PORT}:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - infrastructure

  watchtower:

    image: containrrr/watchtower:latest

    container_name: watchtower

    restart: unless-stopped

    command: --cleanup --interval ${WATCHTOWER_INTERVAL}

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - infrastructure

networks:

  infrastructure:
    external: true

  proxy:
    external: true
