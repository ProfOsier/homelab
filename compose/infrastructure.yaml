name: infrastructure

x-defaults: &defaults
  restart: unless-stopped

  security_opt:
    - no-new-privileges:true

  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:

  homepage:
    <<: *defaults

    image: ghcr.io/gethomepage/homepage:latest

    container_name: homepage

    hostname: homepage

    env_file:
      - ../.env

    # Resolve private .osier.local service names through the homelab DNS.
    dns:
      - ${PIHOLE_IP}

    ports:
      - "${HOMEPAGE_PORT}:3000"

    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.osier.local

    volumes:
      - ../config/infrastructure/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    healthcheck:
      test: ["CMD","wget","-q","--spider","http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 5

    labels:
      homelab.stack: infrastructure
      homelab.service: homepage

    networks:
      - infrastructure

  npm:
    <<: *defaults

    image: jc21/nginx-proxy-manager:latest

    container_name: npm

    hostname: npm

    env_file:
      - ../.env

    ports:
      - "${NPM_HTTP_PORT}:80"
      - "${NPM_HTTPS_PORT}:443"
      - "${NPM_ADMIN_PORT}:81"

    volumes:
      - ../config/infrastructure/npm/data:/data
      - ../config/infrastructure/npm/letsencrypt:/etc/letsencrypt

    healthcheck:
      disable: true

    labels:
      homelab.stack: infrastructure
      homelab.service: nginx-proxy-manager

    networks:
      - infrastructure
      - proxy

  portainer:
    <<: *defaults

    image: portainer/portainer-ce:latest

    container_name: portainer

    hostname: portainer

    env_file:
      - ../.env

    ports:
      - "${PORTAINER_PORT}:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../config/infrastructure/portainer/data:/data

    healthcheck:
      disable: true

    labels:
      homelab.stack: infrastructure
      homelab.service: portainer

    networks:
      - infrastructure

  dozzle:
    <<: *defaults

    image: amir20/dozzle:latest

    container_name: dozzle

    hostname: dozzle

    env_file:
      - ../.env

    ports:
      - "${DOZZLE_PORT}:8080"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      DOZZLE_LEVEL: info

    healthcheck:
      disable: true

    labels:
      homelab.stack: infrastructure
      homelab.service: dozzle

    networks:
      - infrastructure

  uptime-kuma:
    <<: *defaults

    image: louislam/uptime-kuma:latest

    container_name: uptime-kuma

    hostname: uptime-kuma

    ports:
      - "3001:3001"

    volumes:
      - ../config/infrastructure/uptime-kuma:/app/data

    healthcheck:
      disable: true

    labels:
      homelab.stack: infrastructure
      homelab.service: uptime-kuma

    networks:
      - infrastructure
      - proxy

