name: homelab
services:
  cadvisor:
    container_name: cadvisor
    devices:
      - source: /dev/kmsg
        target: /dev/kmsg
        permissions: rwm
    image: gcr.io/cadvisor/cadvisor:latest
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      monitoring: null
    ports:
      - mode: ingress
        target: 8080
        published: "8081"
        protocol: tcp
    privileged: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind: {}
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
        bind: {}
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
        bind: {}
  dozzle:
    container_name: dozzle
    environment:
      CADVISOR_PORT: "8081"
      DOMAIN: osier.local
      DOZZLE_LEVEL: info
      DOZZLE_PORT: "8088"
      GRAFANA_PORT: "3002"
      HOMEPAGE_PORT: "3000"
      HOST_IP: 192.168.1.5
      NPM_ADMIN_PORT: "81"
      NPM_HTTP_PORT: "80"
      NPM_HTTPS_PORT: "443"
      OMADA_IP: 192.168.1.4
      OPNSENSE_IP: 192.168.1.1
      PIHOLE_IP: 192.168.1.5
      PORTAINER_PORT: "9443"
      PROMETHEUS_PORT: "9090"
      TRUENAS_IP: 192.168.1.7
      TZ: America/Chicago
      WATCHTOWER_INTERVAL: "86400"
    hostname: dozzle
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080
      timeout: 5s
      interval: 30s
      retries: 5
    image: amir20/dozzle:latest
    labels:
      homelab.service: dozzle
      homelab.stack: infrastructure
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      infrastructure: null
    ports:
      - mode: ingress
        target: 8080
        published: "8088"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {}
  grafana:
    container_name: grafana
    environment:
      GF_SERVER_ROOT_URL: https://grafana.osier.local
    image: grafana/grafana-oss:12.1.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      monitoring: null
    ports:
      - mode: ingress
        target: 3000
        published: "3002"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /opt/homelab/config/monitoring/grafana
        target: /var/lib/grafana
        bind: {}
  homepage:
    container_name: homepage
    environment:
      CADVISOR_PORT: "8081"
      DOMAIN: osier.local
      DOZZLE_PORT: "8088"
      GRAFANA_PORT: "3002"
      HOMEPAGE_ALLOWED_HOSTS: homepage.osier.local
      HOMEPAGE_PORT: "3000"
      HOST_IP: 192.168.1.5
      NPM_ADMIN_PORT: "81"
      NPM_HTTP_PORT: "80"
      NPM_HTTPS_PORT: "443"
      OMADA_IP: 192.168.1.4
      OPNSENSE_IP: 192.168.1.1
      PIHOLE_IP: 192.168.1.5
      PORTAINER_PORT: "9443"
      PROMETHEUS_PORT: "9090"
      TRUENAS_IP: 192.168.1.7
      TZ: America/Chicago
      WATCHTOWER_INTERVAL: "86400"
    hostname: homepage
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:3000
      timeout: 5s
      interval: 30s
      retries: 5
    image: ghcr.io/gethomepage/homepage:latest
    labels:
      homelab.service: homepage
      homelab.stack: infrastructure
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      infrastructure: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /opt/homelab/config/infrastructure/homepage
        target: /app/config
        bind: {}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind: {}
  loki:
    command:
      - -config.file=/etc/loki/local-config.yaml
    container_name: loki
    image: grafana/loki:3.5.4
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      monitoring: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /opt/homelab/config/monitoring/loki
        target: /etc/loki
        bind: {}
  node-exporter:
    command:
      - --path.rootfs=/host
    container_name: node-exporter
    image: prom/node-exporter:v1.9.1
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    network_mode: host
    pid: host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          propagation: rslave
  npm:
    container_name: npm
    environment:
      CADVISOR_PORT: "8081"
      DOMAIN: osier.local
      DOZZLE_PORT: "8088"
      GRAFANA_PORT: "3002"
      HOMEPAGE_PORT: "3000"
      HOST_IP: 192.168.1.5
      NPM_ADMIN_PORT: "81"
      NPM_HTTP_PORT: "80"
      NPM_HTTPS_PORT: "443"
      OMADA_IP: 192.168.1.4
      OPNSENSE_IP: 192.168.1.1
      PIHOLE_IP: 192.168.1.5
      PORTAINER_PORT: "9443"
      PROMETHEUS_PORT: "9090"
      TRUENAS_IP: 192.168.1.7
      TZ: America/Chicago
      WATCHTOWER_INTERVAL: "86400"
    hostname: npm
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:81
      timeout: 5s
      interval: 30s
      retries: 5
    image: jc21/nginx-proxy-manager:latest
    labels:
      homelab.service: nginx-proxy-manager
      homelab.stack: infrastructure
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      infrastructure: null
      proxy: null
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
      - mode: ingress
        target: 81
        published: "81"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /opt/homelab/config/infrastructure/npm/data
        target: /data
        bind: {}
      - type: bind
        source: /opt/homelab/config/infrastructure/npm/letsencrypt
        target: /etc/letsencrypt
        bind: {}
  portainer:
    container_name: portainer
    environment:
      CADVISOR_PORT: "8081"
      DOMAIN: osier.local
      DOZZLE_PORT: "8088"
      GRAFANA_PORT: "3002"
      HOMEPAGE_PORT: "3000"
      HOST_IP: 192.168.1.5
      NPM_ADMIN_PORT: "81"
      NPM_HTTP_PORT: "80"
      NPM_HTTPS_PORT: "443"
      OMADA_IP: 192.168.1.4
      OPNSENSE_IP: 192.168.1.1
      PIHOLE_IP: 192.168.1.5
      PORTAINER_PORT: "9443"
      PROMETHEUS_PORT: "9090"
      TRUENAS_IP: 192.168.1.7
      TZ: America/Chicago
      WATCHTOWER_INTERVAL: "86400"
    hostname: portainer
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - -q
        - --spider
        - https://localhost:9443
      timeout: 10s
      interval: 30s
      retries: 5
    image: portainer/portainer-ce:latest
    labels:
      homelab.service: portainer
      homelab.stack: infrastructure
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      infrastructure: null
    ports:
      - mode: ingress
        target: 9443
        published: "9443"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: {}
      - type: bind
        source: /opt/homelab/config/infrastructure/portainer/data
        target: /data
        bind: {}
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    container_name: prometheus
    image: prom/prometheus:v3.6.0
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      monitoring: null
    ports:
      - mode: ingress
        target: 9090
        published: "9090"
        protocol: tcp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /opt/homelab/config/monitoring/prometheus
        target: /etc/prometheus
        bind: {}
      - type: bind
        source: /opt/homelab/config/monitoring/prometheus-data
        target: /prometheus
        bind: {}
  promtail:
    command:
      - -config.file=/etc/promtail/config.yml
    container_name: promtail
    image: grafana/promtail:3.5.4
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      monitoring: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/log
        target: /var/log
        bind: {}
      - type: bind
        source: /opt/homelab/compose/config/monitoring/promtail
        target: /etc/promtail
        bind: {}
  watchtower:
    command:
      - --cleanup
      - --interval
      - "86400"
      - --label-enable
    container_name: watchtower
    hostname: watchtower
    image: containrrr/watchtower:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      homelab.service: watchtower
      homelab.stack: infrastructure
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      infrastructure: null
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: {}
networks:
  infrastructure:
    name: infrastructure
    external: true
  monitoring:
    name: monitoring
    external: true
  proxy:
    name: proxy
    external: true
