services:

  netalertx:
    image: jokobsk/netalertx:latest
    container_name: netalertx

    restart: unless-stopped
    network_mode: host
    read_only: true

    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

  #  security_opt:
  #    - no-new-privileges:true

    environment:
      TZ: ${TZ}

    volumes:
      - ../data/netalertx:/data
      - /etc/localtime:/etc/localtime:ro

    tmpfs:
      - /tmp
      - /run

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:20211"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

    labels:
      homepage.group: Security
      homepage.name: NetAlertX
      homepage.icon: mdi-lan
      homepage.href: http://${HOST_IP}:20211
      homepage.description: Network Discovery
