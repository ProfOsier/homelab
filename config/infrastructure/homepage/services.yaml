- Infrastructure:
    - OPNsense:
        href: https://opnsense.osier.local
        icon: opnsense.png
    - Pi-hole:
        href: https://pihole.osier.local
        icon: pi-hole.png
        widget:
          type: pihole
          url: https://pihole.osier.local
          key: ${PIHOLE_API_KEY}
    - TrueNAS:
        href: https://truenas.osier.local
        icon: truenas.png
    - Omada:
        href: https://omada.osier.local
        icon: tp-link.png
- Containers:
    - Homepage:
        server: my-docker
        container: homepage
        showStats: true
        href: https://homepage.osier.local
    - Portainer:
        server: my-docker
        container: portainer
        showStats: true
        href: https://portainer.osier.local
        widget:
          type: portainer
          url: https://portainer.osier.local
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}"
    - Dozzle:
        server: my-docker
        container: dozzle
        showStats: true
        href: https://dozzle.osier.local
    - Nginx Proxy Manager:
        server: my-docker
        container: npm
        showStats: true
        href: https://proxy.osier.local
- Monitoring:
    - OpenObserve:
        server: my-docker
        container: openobserve
        showStats: true
        href: https://logs.osier.local/
        description: Centralized logs and observability
        icon: mdi-text-box-search-outline
    - Prometheus:
        href: https://prometheus.osier.local
    - Uptime Kuma:
        server: my-docker
        container: uptime-kuma
        showStats: true
        href: https://uptime.osier.local
- Security:
    - Nessus:
        href: https://nessus.osier.local
- Applications:
    - Nextcloud:
        href: https://nextcloud.osier.net
    - Immich:
        href: https://immich.osier.net
