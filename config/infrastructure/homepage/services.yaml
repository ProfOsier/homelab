---
- Infrastructure:
    - OPNsense:
        href: https://opnsense.osier.local
        description: Edge firewall and routing
        icon: opnsense.png
        ping: https://opnsense.osier.local
    - Pi-hole:
        href: https://pihole.osier.local
        description: DNS filtering and resolver telemetry
        icon: pi-hole.png
