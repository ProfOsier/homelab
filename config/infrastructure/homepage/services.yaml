---
- Infrastructure:
    - OPNsense:
        href: https://opnsense.osier.local
        description: Edge firewall and routing
        icon: opnsense.png
        siteMonitor: https://opnsense.osier.local
    - Pi-hole:
        href: https://pihole.osier.local/admin
        description: DNS filtering and resolver telemetry
        icon: pi-hole.png
        siteMonitor: https://pihole.osier.local/admin
        widget:
          type: pihole
          url: http://192.168.1.5:1000
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"
    - TrueNAS:
        href: https://truenas.osier.local
        description: Storage fabric and datasets
        icon: truenas.png
        siteMonitor: https://truenas.osier.local
    - Omada:
        href: https://omada.osier.local
        description: Wireless and switching control plane
        icon: tp-link.png
        siteMonitor: https://omada.osier.local

- Monitoring:
    - OpenObserve:
        server: my-docker
        container: openobserve
        showStats: true
        href: https://logs.osier.local/
        description: Centralized logs and observability
        icon: mdi-text-box-search-outline
        siteMonitor: https://logs.osier.local/
    - Prometheus:
        href: https://prometheus.osier.local
        description: Metrics collection and alert queries
        icon: prometheus.png
        siteMonitor: https://prometheus.osier.local
    - Uptime Kuma:
        server: my-docker
        container: uptime-kuma
        showStats: true
        href: https://uptime.osier.local
        description: Availability probes and incident status
        icon: uptime-kuma.png
        siteMonitor: https://uptime.osier.local

- Security:
    - Nessus:
        href: https://nessus.osier.local
        description: Vulnerability assessment console
        icon: nessus.png
        siteMonitor: https://nessus.osier.local

- Containers:
    - Homepage:
        server: my-docker
        container: homepage
        showStats: true
        href: https://homepage.osier.local
        description: Command center interface
        icon: homepage.png
        siteMonitor: https://homepage.osier.local
    - Portainer:
        server: my-docker
        container: portainer
        showStats: true
        href: https://portainer.osier.local
        description: Container fleet administration
        icon: portainer.png
        siteMonitor: https://portainer.osier.local
        widget:
          type: portainer
          url: https://portainer.osier.local
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_API_KEY}}"
    - Dozzle:
        server: my-docker
        container: dozzle
        showStats: true
        href: https://dozzle.osier.local
        description: Live container log stream
        icon: dozzle.png
        siteMonitor: https://dozzle.osier.local
    - Nginx Proxy Manager:
        server: my-docker
        container: npm
        showStats: true
        href: https://proxy.osier.local
        description: Reverse proxy and certificate control
        icon: nginx-proxy-manager.png
        siteMonitor: https://proxy.osier.local

- Applications:
    - Nextcloud:
        href: https://nextcloud.osier.net
        description: Private file collaboration
        icon: nextcloud.png
        siteMonitor: https://nextcloud.osier.net
    - Immich:
        href: https://immich.osier.net
        description: Photo and media archive
        icon: immich.png
        siteMonitor: https://immich.osier.net
