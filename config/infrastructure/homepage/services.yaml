        widget:
          type: pihole
          url: https://pihole.osier.local
          key: ${PIHOLE_API_KEY}
    - TrueNAS:
        href: https://truenas.osier.local
        description: Storage fabric and datasets
        icon: truenas.png
        ping: https://truenas.osier.local
    - Omada:
