        widget:
          type: grafana
          url: https://grafana.osier.local
          username: ${GRAFANA_USERNAME}
          password: ${GRAFANA_PASSWORD}
    - Prometheus:
        href: https://prometheus.osier.local
        description: Metrics collection and alert queries
        icon: prometheus.png
